<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Access-Control-Allow-Origin" content="*" />
    <!-- CSP is primarily delivered via Cloudflare _headers; meta tag provides fallback -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' static.cloudflareinsights.com cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%VITE_SITE_LOGO%" />
    <link rel="apple-touch-icon" href="%VITE_SITE_APPLE_LOGO%" />
    <link rel="bookmark" href="%VITE_SITE_APPLE_LOGO%" />
    <link rel="apple-touch-icon-precomposed" sizes="200x200" href="%VITE_SITE_APPLE_LOGO%" />
    <meta name="description" content="%VITE_SITE_DES%" />
    <meta name="keywords" content="%VITE_SITE_KEYWORDS%" />
    <meta name="author" content="%VITE_SITE_AUTHOR%" />
    <meta property="og:title" content="%VITE_SITE_NAME%" />
    <meta property="og:description" content="%VITE_SITE_DES%" />
    <meta property="og:image" content="%VITE_SITE_URL%/screenshots/main.jpg" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_SITE_NAME%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_SITE_NAME%" />
    <meta name="twitter:description" content="%VITE_SITE_DES%" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/screenshots/main.jpg" />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta name="theme-color" content="#424242" />
    <title>%VITE_SITE_NAME%</title>
    <!-- IE Out -->
    <script>
      if (/*@cc_on!@*/ false || (!!window.MSInputMethodContext && !!document.documentMode))
        window.location.href =
          'https://support.dmeng.net/upgrade-your-browser.html?referrer=' +
          encodeURIComponent(window.location.href);
    </script>
  </head>

  <body>
    <!-- 主体内容 -->
    <div id="app">
      <div id="app-loading" style="display:flex;align-items:center;justify-content:center;height:100vh;color:rgba(255,255,255,0.6);font-family:sans-serif;font-size:14px">Loading...</div>
      <div id="app-error" style="display:none;align-items:center;justify-content:center;height:100vh;color:#f87171;font-family:monospace;font-size:13px;padding:20px;white-space:pre-wrap;word-break:break-all"></div>
    </div>
    <!-- noscript -->
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;font-family:sans-serif;font-size:16px;text-align:center;background:#333">请开启 JavaScript 以访问本站<br><small style="color:rgba(255,255,255,0.4)">Please enable JavaScript</small></div>
    </noscript>
    <script>
      window.__debugErrors = [];
      window.addEventListener('error', function(e) {
        var err = e.message || (e.target && e.target.src ? 'Failed to load: ' + e.target.src : 'Unknown error');
        window.__debugErrors.push(err);
        var el = document.getElementById('app-error');
        var ld = document.getElementById('app-loading');
        if (el) { el.style.display = 'flex'; el.textContent = 'JS Error: ' + err + '\n\nAll errors:\n' + window.__debugErrors.join('\n'); }
        if (ld) ld.style.display = 'none';
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var err = e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled Promise';
        window.__debugErrors.push('Promise: ' + err);
        var el = document.getElementById('app-error');
        var ld = document.getElementById('app-loading');
        if (el) { el.style.display = 'flex'; el.textContent = 'Promise Error: ' + err; }
        if (ld) ld.style.display = 'none';
      });
    </script>
    <script>
      // 临时禁用 SW 以排查问题
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
